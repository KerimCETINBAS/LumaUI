name: Release addons

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and changelog
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Build, integration test and package all addons
        run: npm run build:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          archive="artifacts/LumaUI-$version.zip"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" artifacts/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "LumaUI $version" --notes-file artifacts/release-notes.md --draft=false "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "$archive" artifacts/SHA256SUMS --verify-tag --title "LumaUI $version" --notes-file artifacts/release-notes.md "${flags[@]}"
          fi
